name: SeatNow CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  user-service-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17

        env:
          POSTGRES_DB: seatnow_users
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U testuser"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_USERNAME: testuser
      DB_PASSWORD: testpassword
      JWT_SECRET: ci-only-jwt-secret-that-is-long-enough-for-testing-seatnow-123456789

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build user-service
        working-directory: ./user-service
        run: ./mvnw clean package


  event-service-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17

        env:
          POSTGRES_DB: seatnow_events
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U testuser"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_USERNAME: testuser
      DB_PASSWORD: testpassword
      JWT_SECRET: ci-only-jwt-secret-that-is-long-enough-for-testing-seatnow-123456789

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and test event-service
        working-directory: ./event-service
        run: ./mvnw clean package