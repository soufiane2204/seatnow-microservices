apiVersion: apps/v1
kind: Deployment

metadata:
  name: event-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: event-service

  template:
    metadata:
      labels:
        app: event-service

    spec:
      containers:
        - name: event-service
          image: ghcr.io/soufiane2204/seatnow-event-service:latest

          ports:
            - containerPort: 8082

          envFrom:
            - configMapRef:
                name: event-config

            - secretRef:
                name: event-secret