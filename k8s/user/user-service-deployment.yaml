apiVersion: apps/v1
kind: Deployment

metadata:
  name: user-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: user-service

  template:
    metadata:
      labels:
        app: user-service

    spec:
      containers:
        - name: user-service
          image: ghcr.io/soufiane2204/seatnow-user-service:latest

          ports:
            - containerPort: 8081

          envFrom:
            - configMapRef:
                name: user-config

            - secretRef:
                name: user-secret